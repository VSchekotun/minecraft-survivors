ortant;height:252px!important}#ab button{width:76px!important;height:76px!important;font-size:32px!important}#b5{width:46px!important;height:46px!important}}.cd.q0{border-color:#888}.cd.q1{border-color:#4a7bd8;box-shadow:0 0 8px #4a7bd8}.cd.q2{border-color:#a04bff;box-shadow:0 0 10px #a04bff}.cd.q3{border-color:#ffd75b;box-shadow:0 0 14px #ffd75b;animation:gl 1.2s infinite}@keyframes gl{50%{box-shadow:0 0 24px #ffd75b;transform:scale(1.03)}}.bar{pointer-events:auto}#info{display:flex;justify-content:space-between;text-shadow:1px 1px #000}

<div id="hud"><div class="bar"><i id="hpf"></i><b id="hpt"></b></div><div class="bar xp"><i id="xpf"></i></div><div id="info"><span id="i1"></span><span id="i2"></span></div><div id="tk" style="font-size:11px;text-shadow:1px 1px #000"></div></div>

<script>
// Minecraft Survivors — единый файл. Разделы:
// 1. КОНФИГИ  2. ИГРОК  3. ВРАГИ  4. ОРУЖИЕ  5. ЗАКЛИНАНИЯ  6. МАГАЗИН/КАРТЫ

// ======================================================================
// 1. КОНФИГИ: базовые константы, состояние, мир, настройки
// ======================================================================
// ----- Холст и короткие алиасы -----
const $=id=>document.getElementById(id),cv=$('c'),g=cv.getContext('2d'),RN=Math.random,S=Math.sin,C=Math.cos,M=1500;
// ----- Глобальное состояние забега -----
let W,H,D,P,en,pr,pa,gm,wave,wt,wd,spt,tm=0,shake=0,st='play',cd,apples,lvQ=0,snd=true,items=[],rr=0,jv={x:0,y:0},keys={};
let DIM=0;
let kills=[0,0,0,0,0],trees=[],apl=[],ch=[];
let altars=[],rain=0,flash=0,endless=0;
let crs=[];
let fz=[];
let evq=[],zn=[];
// ----- Мир: озёра/лава и факелы -----
const pools=[{x:300,y:300,w:210,h:150,t:'w'},{x:1100,y:420,w:180,h:180,t:'w'},{x:420,y:1100,w:240,h:120,t:'w'},{x:1050,y:1050,w:170,h:120,t:'l'},{x:200,y:800,w:120,h:120,t:'l'}];
const torches=[[600,600],[900,600],[600,900],[900,900],[110,110],[1390,110],[110,1390],[1390,1390]];
// ----- Измерения: название, сложность, описание -----
const DN=[['🌍 Обычный мир','Лёгкая сложность','Леса, дубы, яблоки. 20 волн, финал: Гигант-зомби'],['🔥 Ад','Средняя сложность','Лава, пепел, грибы вместо деревьев'],['🟣 Энд','Тяжёлая сложность','Пустота, хорус-деревья и фиолетовый туман']];
// ----- Настройки (громкость, режим разработчика, клавиши) — загружаются из localStorage -----
var SET=(()=>{try{return Object.assign({vm:.6,vs:1,dev:0},JSON.parse(localStorage.getItem('mss')||'{}'))}catch(e){return{vm:.6,vs:1,dev:0}}})();
var KB_DEF={up:'KeyW',down:'KeyS',left:'KeyA',right:'KeyD',dash:'Space',tnt:'KeyE',apple:'KeyQ',m1:'Digit1',m2:'Digit2',m3:'Digit3',attack:'KeyF',pause:'Escape',inv:'KeyI',p1:'Digit4',p2:'Digit5',p3:'Digit6'};
{const ok=v=>typeof v=='string'&&/^(Key|Digit|Arrow|Numpad|F\d|Space|Escape|Shift|Control|Alt|Tab|Enter|Backquote|Minus|Equal|Bracket|Semicolon|Quote|Comma|Period|Slash|Backslash)/.test(v);if(SET.kb&&Object.values(SET.kb).some(v=>!ok(v)))SET.kb=null}
SET.kb=Object.assign({},KB_DEF,SET.kb||{});
if(SET.auto==null)SET.auto=1;

// ======================================================================
// 2. ИГРОК: старт забега, волны, способности, главный апдейт
// ======================================================================
// ----- Новый забег и волны -----
function init(){P={w:{wwd:1,wbo:1},wc:{},crit:.1,cm:2,gv:1,th:0,dc:1,iv:0,disc:1,burnh:0,slowh:0,kb:0,dod:0,xg:1,ber:0,bd:1,spk:[],si:0,scd:{},bc:{},luck:0,x:750,y:790,hp:100,mhp:100,sp:150,xp:0,lv:1,need:6,em:0,dmg:1,as:1,arm:0,mag:70,face:1,ph:0,inv:0,pierce:1,multi:1,regen:0,vamp:0,tot:0,sw:1e9,bw:1e9,dx:0,dy:1,eq:{main:'wwd',ar:{head:null,chest:null,legs:null,feet:null},art:[null,null,null],belt:[null,null,null]},pb:{}};
cd={d:0,t:0};apples=2;kills=[0,0,0,0,0];trees=[];apl=[];ch=[];wv=[];altars=[];crs=[];fz=[];evq=[];zn=[];cps=[];items=[];drops=[];TB={};{const nt=5+RN()*4|0;for(let i=0;i<nt;i++)addTree()}wave=1;gm=[];pa=[];lvQ=0;tm=0;startWave();mkSpellBtns();beltUI()}
function startWave(){P.co=0;P.wdmg=0;if(wave>=10)ach('wave10');if(wave>=15)ach('wave15');rain=RN()<.2;wt=0;wd=wave%5==0?60:((wave>=10&&wave%3==0)||(wave>=15&&wave%2==1))?40:22+Math.min(wave,10);spt=0;st='play';en=[];pr=[];$('ov').style.display='none';if(wave%5==0){spawn('B');en[en.length-1].bk=0;{const k=endless?RN()*4|0:wave==20?3:((wave/5-1)%3+3)%3|0,m=en[en.length-1];m.bk=DIM==1?4+k:DIM==2?[8,2,10,11][k]:k;if(DIM==2&&k==1){m.sg=1;m.hp=m.mh=m.hp*1.5}}}if((wave>=15&&wave%2==1)||(wave>=10&&wave<15&&wave%3==0)){spawn(['Q','x','X'][DIM],4);if(wave>=15)spawn(['Q','x','X'][DIM],4)}}
function endWave(){const bo=en.find(e=>e.t=='B'&&!e.dead);if(wave==20&&!bo&&!endless){victory();return}if(bo){P.em+=12;txt(bo.x,bo.y-40,'СБЕЖАЛ! +12💎','#fc4');burst(bo.x,bo.y,40,'#b04aff',200,0,.8,5);sfx('roar');shake=10}bp(523,.4,'sine');for(const e of en)burst(e.x,e.y,8,'#fff',80,0,.5);en=[];pr=[];P.em+=5;if(wave>=3&&!P.wdmg)ach('untouch');(P.wb||[]).forEach(f=>f());P.wb=[];if(wave%2==0&&wave>3&&(wave+1)%5!=0&&ch.length<2)ch.push({x:200+RN()*1100,y:200+RN()*1100,n:1,l:0});if(wave%2==1&&(wave+1)%5!=0&&crs.length<1)crs.push({x:200+RN()*1100,y:200+RN()*1100,k:RN()*5|0});wave++;if(wave%3==0)addTree();P.hp=Math.min(P.mhp,P.hp+P.mhp*.2);rr=0;shop(true)}
function endlessGo(){endless=1;P.em+=15;wave++;rr=0;shop(true)}
// ----- Деревья и яблоки на карте -----
function addTree(){for(let k=0;k<20;k++){const x=120+RN()*1260,y=120+RN()*1260;if(Math.hypot(x-750,y-750)>160){trees.push({x,y,n:4,hp:3,sh:0,cd:0,rg:0});return}}}
function dropA(t){if(t.cd>0||t.n<=0)return;t.cd=.8;t.sh=.4;if(t.n==4)t.rg=25;t.n--;apl.push({x:t.x+RN()*30-15,y:t.y+16+RN()*10,g:RN()<.1*lb(),l:20});burst(t.x,t.y-40,4,'#3e9a35',60,120,.6,3)}
// ----- Получение урона, удача -----
function hurt(d){if(P.inv>0||st!='play')return;if(RN()<P.dod){txt(P.x,P.y-24,'УВОРОТ','#9cf');P.inv=.2;return}d=Math.max(1,d*(1-P.arm)-(P.farm||0));if(P.th)for(const e of en)if(Math.hypot(e.x-P.x,e.y-P.y)<60)dmgE(e,8*P.th*P.dmg,1);P.hp-=d;P.cb=0;P.wdmg=1;if(P.hp>0&&P.hp<P.mhp*.05)ach('close');if(P.bo)P.bl=tm+2;navigator.vibrate&&navigator.vibrate(40);P.inv=.5+P.iv;shake=6;burst(P.x,P.y,8,'#c22',90,200,.5);bp(120,.15,'sawtooth');
if(P.hp<=0){if(P.tot>0){P.tot--;P.hp=P.mhp*.5;P.inv=2;txt(P.x,P.y-30,'ТОТЕМ!','#f2c14e');burst(P.x,P.y,30,'#f2c14e',160,0,.8)}else{st='dead';over()}}}
function luckUp(n){P.luck+=n;if(P.luck>=20)ach('lucky');txt(P.x,P.y-36,'+'+n+' 🍀','#7f7')}
function lb(){return 1+(P.luck||0)*.035}
function inPool(t){return pools.some(p=>p.t==t&&P.x>p.x&&P.x<p.x+p.w&&P.y>p.y&&P.y<p.y+p.h)}
// ----- Способности: рывок, динамит, яблоко -----
function dash(){if(cd.d>0||st!='play')return;cd.d=3*P.dc;P.gh=[];for(let i=0;i<8;i++)P.gh.push({x:P.x+P.dx*i*12,y:P.y+P.dy*i*12,l:.5-i*.03});for(let i=0;i<14;i++)pa.push({x:P.x-P.dx*i*6,y:P.y-P.dy*i*6,vx:0,vy:-10,gv:0,l:.4,ml:.4,c:'#b04aff',s:6,k:'q'});P.x=Math.min(M-50,Math.max(50,P.x+P.dx*100));P.y=Math.min(M-50,Math.max(50,P.y+P.dy*100));P.inv=.3;bp(700,.15,'sine')}
function tnt(){if(cd.t>0||st!='play')return;cd.t=7;P.ta=.4;const e=nearD(620),a=e?Math.atan2(e.y-P.y,e.x-P.x):Math.atan2(P.dy,P.dx),d=e?Math.hypot(e.x-P.x,e.y-P.y):150;pr.push({k:'t',x:P.x,y:P.y,vx:C(a)*d/.8,vy:S(a)*d/.8,l:.8,own:1,dmg:45*P.dmg});bp(300,.1)}
function apple(){if(apples<=0||st!='play'||P.hp>=P.mhp)return;apples--;P.ap2=tm+.5;txt(P.x,P.y-40,'+'+Math.round(P.mhp*.3),'#7f7');P.hp=Math.min(P.mhp,P.hp+P.mhp*.3);for(let i=0;i<10;i++)pa.push({x:P.x+RN()*20-10,y:P.y,vx:0,vy:-50,gv:0,l:.9,ml:.9,c:'#f2c14e',s:4,k:'q'});bp(880,.2,'sine')}
// ----- Отложенные события (later) и зоны -----
function later(t,f){evq.push({t,f})}
function evqRun(dt){for(let i=evq.length-1;i>=0;i--){const q=evq[i];q.t-=dt;if(q.t<=0){evq.splice(i,1);q.f()}}
for(const z of zn){z.l-=dt;z.t-=dt;if(z.t<=0){z.t=.5;for(const q of en)if(!q.dead&&Math.hypot(q.x-z.x,q.y-z.y)<z.r){dmgE(q,z.d*P.dmg,1);if(z.slow)q.slow=1}}}zn=zn.filter(z=>z.l>0)}
// ----- Волки-союзники, алтари, кристаллы-баффы, автонажатие -----

function tone(f,d,t='square',v=.05,sl=1,dl=0){if(!snd)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),n=ac.createGain(),T=ac.currentTime+dl;o.type=t;o.frequency.setValueAtTime(f,T);o.frequency.exponentialRampToValueAtTime(Math.max(20,f*sl),T+d);n.gain.setValueAtTime(v*VOL(),T);n.gain.exponentialRampToValueAtTime(.001,T+d);o.connect(n);n.connect(ac.destination);o.start(T);o.stop(T+d)}catch(e){}}

function mt(...a){tone.m=1;tone(...a);tone.m=0}

case'tr':tone(300,.25,'sawtooth',.04,2.5);break;case'cb':tone(150,.08,'square',.06,.5);tone(450,.1,'square',.04,.6,.05);break;
case'fw':nz(.3,.08,900);tone(200,.3,'sawtooth',.03,1.8);break;case'lg':tone(1200,.18,'sawtooth',.05,.1);nz(.08,.1,6000);break;
case'ic':tone(1400,.35,'sine',.05,.7);tone(2100,.3,'sine',.03,.7,.06);break;case'fb':nz(.35,.12,600);tone(120,.35,'sawtooth',.05,.5);break;
case'wd':nz(.4,.1,1200);tone(180,.4,'sine',.05,2);break;case'pt':for(let i=0;i<4;i++)tone(400+i*120,.08,'sine',.04,1.5,i*.06);break;
case'hit':tone(220,.06,'square',.04,.6);break;case'crit':tone(900,.1,'square',.05,.5);tone(1300,.1,'square',.04,.5,.05);break;
case'kill':tone(200,.15,'sawtooth',.04,.3);break;case'boom':nz(.5,.2,500);tone(70,.4,'sawtooth',.08,.4);break;
case'roar':nz(.8,.15,400);tone(90,.8,'sawtooth',.08,.6);break;case'hurt':tone(160,.2,'sawtooth',.07,.5);nz(.1,.08,900);break;
case'dash':nz(.2,.08,4000);tone(300,.2,'sine',.05,3);break;case'tnt':tone(1000,.3,'square',.02,.5);break;
case'apple':tone(660,.1,'sine',.06);tone(990,.15,'sine',.06,1,.08);break;case'gem':tone(1200,.06,'sine',.03);break;
case'lvl':[523,659,784,1047].forEach((f,i)=>tone(f,.2,'square',.04,1,i*.09));break;case'wave':[392,523,659].forEach((f,i)=>tone(f,.3,'triangle',.06,1,i*.12));break;
